name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The key's authorized_keys entry on the VPS forces execution of
          # ~/deploy.sh regardless of the command sent here (defence in depth
          # in case this workflow or the key is ever compromised).
          script: ~/deploy.sh
